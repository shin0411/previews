  var form = document.getElementById('f');
  var input = document.getElementById('p');
  var button = document.getElementById('b');
  var message = document.getElementById('m');

  function b64(str) {
    var bin = atob(str);
    var out = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
    return out;
  }

  if (!window.crypto || !window.crypto.subtle) {
    message.textContent = 'この開き方では表示できません。共有された https のURLからアクセスしてください。';
    button.disabled = true;
    return;
  }

  function unlock(password) {
    var enc = new TextEncoder();
    return crypto.subtle
      .importKey('raw', enc.encode(password), { name: 'PBKDF2' }, false, ['deriveKey'])
      .then(function (material) {
        return crypto.subtle.deriveKey(
          { name: 'PBKDF2', salt: b64(CFG.s), iterations: CFG.i, hash: 'SHA-256' },
          material,
          { name: 'AES-GCM', length: 256 },
          false,
          ['decrypt']
        );
      })
      .then(function (key) {
        return crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64(CFG.v) }, key, b64(CFG.d));
      })
      .then(function (plain) {
        var html = new TextDecoder().decode(plain);
        try { sessionStorage.setItem('hpmaker-preview', password); } catch (e) {}
        document.open();
        document.write(html);
        document.close();
      });
  }

  form.addEventListener('submit', function (event) {
    event.preventDefault();
    message.textContent = '';
    button.disabled = true;
    unlock(input.value).catch(function () {
      button.disabled = false;
      message.textContent = 'パスワードが違います。';
      input.select();
    });
  });

  // 同一セッション内での再読み込みでは入力を省く
  try {
    var saved = sessionStorage.getItem('hpmaker-preview');
    if (saved) unlock(saved).catch(function () { sessionStorage.removeItem('hpmaker-preview'); });
  } catch (e) {}
})();
</script>
